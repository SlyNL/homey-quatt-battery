<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
  background: transparent;
  color: #fff;
  padding: 10px 12px;
  overflow: hidden;
}
.soc-block { text-align: center; padding-bottom: 4px; }
.soc-num {
  font-size: 52px; font-weight: 700; color: #2DD4BF;
  line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -3px;
}
.soc-label {
  font-size: 9px; color: rgba(255,255,255,0.4);
  letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px;
}
.bar-track {
  height: 3px; background: rgba(255,255,255,0.1);
  border-radius: 2px; margin: 7px 0 8px; overflow: hidden;
}
.bar-fill { height: 100%; background: #2DD4BF; border-radius: 2px; transition: width 0.5s ease; }
.status-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px;
  border-radius: 100px; font-size: 9px; font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase;
}
.chip-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.chip.idle        { background: rgba(255,255,255,0.1);   color: rgba(255,255,255,0.55); }
.chip.charging    { background: rgba(45,212,191,0.18);   color: #2DD4BF; }
.chip.discharging { background: rgba(167,139,250,0.18);  color: #A78BFA; }
.power-val { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.power-unit { font-size: 10px; color: rgba(255,255,255,0.45); margin-left: 2px; }
.div { height: 1px; background: rgba(255,255,255,0.08); margin: 8px 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 6px; }
.stat { display: flex; flex-direction: column; gap: 1px; }
.stat-lbl { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.07em; color: rgba(255,255,255,0.35); white-space: nowrap; }
.stat-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: #fff; white-space: nowrap; }
.stat-val.euro   { color: #F5B800; }
.stat-val.solar  { color: #F5B800; }
.stat-val.import { color: #FB7185; }
.stat-val.export { color: #34D399; }
.stat-val.dim    { color: rgba(255,255,255,0.55); }
.setup {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 160px; gap: 8px; color: rgba(255,255,255,0.4);
  text-align: center; font-size: 10px; line-height: 1.5;
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="setup" class="setup hidden">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5">
    <rect x="2" y="7" width="16" height="11" rx="2"/>
    <path d="M20 11h1a1 1 0 0 1 1 1v0a1 1 0 0 1-1 1h-1"/>
    <line x1="6" y1="7" x2="6" y2="5"/><line x1="10" y1="7" x2="10" y2="5"/>
  </svg>
  <div>Select a battery<br>in the widget settings</div>
</div>

<div id="main">
  <div class="soc-block">
    <div class="soc-num" id="soc">–</div>
    <div class="soc-label">State of Charge</div>
  </div>
  <div class="bar-track"><div class="bar-fill" id="bar" style="width:0%"></div></div>

  <div class="status-row">
    <div class="chip idle" id="chip"><span class="chip-dot"></span><span id="chip-txt">–</span></div>
    <div><span class="power-val" id="power">–</span><span class="power-unit">kW</span></div>
  </div>

  <div class="div"></div>

  <div class="stats" style="margin-bottom:8px">
    <div class="stat">
      <span class="stat-lbl">Total savings</span>
      <span class="stat-val euro" id="sav-total">–</span>
    </div>
    <div class="stat">
      <span class="stat-lbl">Yesterday</span>
      <span class="stat-val euro" id="sav-yday">–</span>
    </div>
  </div>

  <div class="div"></div>

  <div class="stats" style="margin-top:8px">
    <div class="stat">
      <span class="stat-lbl">Solar today</span>
      <span class="stat-val solar" id="solar">–</span>
    </div>
    <div class="stat">
      <span class="stat-lbl">House consumption</span>
      <span class="stat-val" id="house">–</span>
    </div>
    <div class="stat">
      <span class="stat-lbl">Grid import</span>
      <span class="stat-val import" id="grid-in">–</span>
    </div>
    <div class="stat">
      <span class="stat-lbl">Grid export</span>
      <span class="stat-val export" id="grid-out">–</span>
    </div>
  </div>

  <div class="div"></div>

  <div class="stats">
    <div class="stat">
      <span class="stat-lbl">Min SoC today</span>
      <span class="stat-val dim" id="min-soc">–</span>
    </div>
    <div class="stat">
      <span class="stat-lbl">Max SoC today</span>
      <span class="stat-val" id="max-soc">–</span>
    </div>
  </div>
</div>

<script>
'use strict';
const el = (id) => document.getElementById(id);

function fmt(n, dec) {
  if (n == null || isNaN(n)) return '–';
  return Number(n).toFixed(dec != null ? dec : 1);
}

function fmtEuro(n) {
  if (n == null || isNaN(n)) return '–';
  const v = Number(n);
  if (v >= 1000) return '€' + (v / 1000).toFixed(1) + 'k';
  return '€' + v.toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtKwh(n) {
  if (n == null || isNaN(n)) return '–';
  return fmt(n, 1) + ' kWh';
}

function dirStatus(direction, power) {
  const d = String(direction || '').toUpperCase();
  if (d.includes('CHARG'))    return 'charging';
  if (d.includes('DISCHARG')) return 'discharging';
  if (power > 0.05)  return 'charging';
  if (power < -0.05) return 'discharging';
  return 'idle';
}

function render(data) {
  if (!data) return;
  const soc = data.soc ?? 0;
  el('soc').textContent  = Math.round(soc) + '%';
  el('bar').style.width  = Math.min(100, Math.max(0, soc)) + '%';

  const power = data.power ?? 0;
  el('power').textContent = (power > 0 ? '+' : '') + fmt(power, 1);

  const status = dirStatus(data.direction, power);
  el('chip').className   = 'chip ' + status;
  el('chip-txt').textContent = { charging: 'Charging', discharging: 'Discharging', idle: 'Idle' }[status];

  el('sav-total').textContent = fmtEuro(data.savingsTotal);
  el('sav-yday').textContent  = fmtEuro(data.savingsYday);
  el('solar').textContent     = fmtKwh(data.solar);
  el('house').textContent     = fmtKwh(data.house);
  el('grid-in').textContent   = fmtKwh(data.gridIn);
  el('grid-out').textContent  = fmtKwh(data.gridOut);
  el('min-soc').textContent   = fmt(data.minSoc, 0) + '%';
  el('max-soc').textContent   = fmt(data.maxSoc, 0) + '%';
}

async function main() {
  let settings;
  try { settings = await HomeyWidget.getSettings(); } catch (_) { return; }

  if (!settings || !settings.deviceId) {
    el('main').classList.add('hidden');
    el('setup').classList.remove('hidden');
    return;
  }

  async function refresh() {
    try {
      const data = await HomeyWidget.api('GET', '/state', { deviceId: settings.deviceId });
      render(data);
    } catch (_) {}
  }

  await refresh();
  const timer = setInterval(refresh, 30000);

  HomeyWidget.on('settings', (s) => {
    settings = s;
    if (!s || !s.deviceId) { clearInterval(timer); el('main').classList.add('hidden'); el('setup').classList.remove('hidden'); return; }
    refresh();
  });
}

main().catch(console.error);
</script>
</body>
</html>
