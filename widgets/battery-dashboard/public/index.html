<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; background: transparent; padding: 10px 12px; overflow: hidden; }
.soc-num { font-size: 52px; font-weight: 700; color: #2DD4BF; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -3px; }
.soc-block { text-align: center; padding-bottom: 4px; }
.soc-label { font-size: 9px; color: rgba(128,128,128,0.8); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
.bar-track { height: 3px; background: rgba(128,128,128,0.15); border-radius: 2px; margin: 7px 0 8px; overflow: hidden; }
.bar-fill { height: 100%; background: #2DD4BF; border-radius: 2px; transition: width 0.5s ease; }
.status-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 100px; font-size: 9px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
.chip-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.chip.idle        { background: rgba(128,128,128,0.1);  color: rgba(128,128,128,0.7); }
.chip.charging    { background: rgba(45,212,191,0.15);  color: #0d9488; }
.chip.discharging { background: rgba(139,92,246,0.15);  color: #7c3aed; }
.power-val { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.power-unit { font-size: 10px; color: rgba(128,128,128,0.6); margin-left: 2px; }
.div { height: 1px; background: rgba(128,128,128,0.12); margin: 8px 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 6px; }
.stat { display: flex; flex-direction: column; gap: 1px; }
.stat-lbl { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.07em; color: rgba(128,128,128,0.6); white-space: nowrap; }
.stat-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat-val.euro { color: #d97706; }
.stat-val.solar { color: #d97706; }
.stat-val.import { color: #dc2626; }
.stat-val.export { color: #16a34a; }
.stat-val.dim { color: rgba(128,128,128,0.6); }
</style>
</head>
<body class="homey-widget">

<div class="soc-block">
  <div class="soc-num" id="soc">–</div>
  <div class="soc-label">State of Charge</div>
</div>
<div class="bar-track"><div class="bar-fill" id="bar" style="width:0%"></div></div>
<div class="status-row">
  <div class="chip idle" id="chip"><span class="chip-dot"></span><span id="chip-txt">–</span></div>
  <div><span class="power-val" id="power">–</span><span class="power-unit">kW</span></div>
</div>
<div class="div"></div>
<div class="stats" style="margin-bottom:8px">
  <div class="stat"><span class="stat-lbl">Total savings</span><span class="stat-val euro" id="sav-total">–</span></div>
  <div class="stat"><span class="stat-lbl">Yesterday</span><span class="stat-val euro" id="sav-yday">–</span></div>
</div>
<div class="div"></div>
<div class="stats" style="margin-top:8px">
  <div class="stat"><span class="stat-lbl">Solar today</span><span class="stat-val solar" id="solar">–</span></div>
  <div class="stat"><span class="stat-lbl">House consumption</span><span class="stat-val" id="house">–</span></div>
  <div class="stat"><span class="stat-lbl">Grid import</span><span class="stat-val import" id="grid-in">–</span></div>
  <div class="stat"><span class="stat-lbl">Grid export</span><span class="stat-val export" id="grid-out">–</span></div>
</div>
<div class="div"></div>
<div class="stats">
  <div class="stat"><span class="stat-lbl">Min SoC today</span><span class="stat-val dim" id="min-soc">–</span></div>
  <div class="stat"><span class="stat-lbl">Max SoC today</span><span class="stat-val" id="max-soc">–</span></div>
</div>

<script type="text/javascript">
function onHomeyReady(Homey) {
  'use strict';
  function el(id) { return document.getElementById(id); }
  function fmt(n, dec) { if (n == null || isNaN(n)) return '–'; return Number(n).toFixed(dec != null ? dec : 1); }
  function fmtEuro(n) {
    if (n == null || isNaN(n)) return '–';
    var v = Number(n);
    if (v >= 1000) return '€' + (v/1000).toFixed(1) + 'k';
    return '€' + v.toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtKwh(n) { if (n == null || isNaN(n)) return '–'; return fmt(n,1) + ' kWh'; }
  function dirStatus(direction, power) {
    var d = String(direction || '').toUpperCase();
    if (d.includes('CHARG'))    return 'charging';
    if (d.includes('DISCHARG')) return 'discharging';
    if (power > 0.05)  return 'charging';
    if (power < -0.05) return 'discharging';
    return 'idle';
  }
  function render(data) {
    if (!data) return;
    var soc = data.soc != null ? data.soc : 0;
    el('soc').textContent = Math.round(soc) + '%';
    el('bar').style.width = Math.min(100, Math.max(0, soc)) + '%';
    var power = data.power != null ? data.power : 0;
    el('power').textContent = (power > 0 ? '+' : '') + fmt(power, 1);
    var status = dirStatus(data.direction, power);
    el('chip').className = 'chip ' + status;
    el('chip-txt').textContent = { charging: 'Charging', discharging: 'Discharging', idle: 'Idle' }[status];
    el('sav-total').textContent = fmtEuro(data.savingsTotal);
    el('sav-yday').textContent  = fmtEuro(data.savingsYday);
    el('solar').textContent     = fmtKwh(data.solar);
    el('house').textContent     = fmtKwh(data.house);
    el('grid-in').textContent   = fmtKwh(data.gridIn);
    el('grid-out').textContent  = fmtKwh(data.gridOut);
    el('min-soc').textContent   = fmt(data.minSoc, 0) + '%';
    el('max-soc').textContent   = fmt(data.maxSoc, 0) + '%';
  }

  function refresh() {
    Homey.api('GET', '/state', {})
      .then(function(data) { render(data); })
      .catch(function(err) { console.error('refresh error:', err); });
  }

  refresh();
  setInterval(refresh, 30000);
  Homey.ready();
}
</script>
</body>
</html>
